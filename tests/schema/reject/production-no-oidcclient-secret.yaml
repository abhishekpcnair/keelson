# expect: /auth/oidcClient/secretRef/name
# production needs the Secret of the OIDC client, so upstream's public client secret is not used.
environment: production
domain: kubeflow.example.com
tls: { issuer: external }
auth:
  staticUsers: { enabled: false }
  cookie: { secretRef: { name: oauth2-proxy-cookie } }
  oidcClient: { secretRef: { name: "" } }
  dex:
    connectors:
      - type: oidc
        id: idp
        issuer: https://login.example.com
        secretRef: { name: dex-idp }
