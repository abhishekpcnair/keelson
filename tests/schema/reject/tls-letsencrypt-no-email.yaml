# expect: at '/tls/acme/email': minLength: got 0, want 1
# letsencrypt needs tls.acme.email: the ACME account contact.
domain: kubeflow.example.com
tls:
  issuer: letsencrypt
  acme:
    dns01:
      azureDNS:
        subscriptionID: 00000000-0000-0000-0000-000000000000
        resourceGroupName: dns-zones
        hostedZoneName: example.com
        managedIdentity: { clientID: 11111111-1111-1111-1111-111111111111 }
