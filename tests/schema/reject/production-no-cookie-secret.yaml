# expect: /auth/cookie
# production needs the cookie Secret, so upstream's public cookie secret is not used.
environment: production
domain: kubeflow.example.com
tls: { issuer: external }
auth:
  staticUsers: { enabled: false }
  oidcClient: { secretRef: { name: kubeflow-oidc-client } }
  dex:
    connectors:
      - type: oidc
        id: idp
        issuer: https://login.example.com
        secretRef: { name: dex-idp }
