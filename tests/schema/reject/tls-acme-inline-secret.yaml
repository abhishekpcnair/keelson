# expect: additional properties 'clientSecret' not allowed
# Rule 6: no inline secrets. clientSecretRef takes a Secret name, never the secret itself.
domain: kubeflow.example.com
tls:
  issuer: letsencrypt
  acme:
    email: platform-team@example.com
    dns01:
      azureDNS:
        subscriptionID: 00000000-0000-0000-0000-000000000000
        resourceGroupName: dns-zones
        hostedZoneName: example.com
        clientID: 22222222-2222-2222-2222-222222222222
        tenantID: 33333333-3333-3333-3333-333333333333
        clientSecret: not-a-real-secret
        clientSecretRef: { name: azuredns-sp }
