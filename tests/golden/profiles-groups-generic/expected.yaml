---
# Source: keelson/templates/components/profiles.yaml
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: keelson-groups
  namespace: team-vision
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: keelson-profiles
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # No selector: every workload in the namespace.
  jwtRules:
    - issuer: "http://dex.auth.svc.cluster.local:5556/dex"
      jwksUri: "http://dex.auth.svc.cluster.local:5556/dex/keys"
      forwardOriginalToken: true
      # As upstream's dex-jwt and m2m-token-issuer: the Authorization header only.
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
    - issuer: "https://oidc.prod-aks.azure.com/00000000-0000-0000-0000-000000000000/"
      jwksUri: "https://oidc.prod-aks.azure.com/00000000-0000-0000-0000-000000000000/openid/v1/jwks"
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
    - issuer: "https://kubernetes.default.svc.cluster.local"
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
