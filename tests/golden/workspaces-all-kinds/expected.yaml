apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: keelson
  source:
    path: common/cert-manager/base
    repoURL: https://github.com/kubeflow/manifests
    targetRevision: 26.10.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true

