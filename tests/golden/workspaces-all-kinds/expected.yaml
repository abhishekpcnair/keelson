# Source: keelson/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workspace-kinds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: workspace-kinds
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  destination:
    namespace: kubeflow-workspaces
    server: https://kubernetes.default.svc
  project: keelson
  source:
    kustomize:
      patches:
      - patch: |-
          # purpose: drop upstream sample PersistentVolumeClaim/workspace-home-pvc; it is not part of a Keelson install
          # upstream: none
          # remove-when: upstream ships an installable WorkspaceKinds overlay (then point workspace-kinds at it)
          $patch: delete
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: workspace-home-pvc
        target:
          kind: PersistentVolumeClaim
          name: workspace-home-pvc
          version: v1
      - patch: |-
          # purpose: drop upstream sample PersistentVolumeClaim/workspace-data-pvc; it is not part of a Keelson install
          # upstream: none
          # remove-when: upstream ships an installable WorkspaceKinds overlay (then point workspace-kinds at it)
          $patch: delete
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: workspace-data-pvc
        target:
          kind: PersistentVolumeClaim
          name: workspace-data-pvc
          version: v1
      - patch: |-
          # purpose: drop upstream sample Secret/workspace-secret; it is not part of a Keelson install
          # upstream: none
          # remove-when: upstream ships an installable WorkspaceKinds overlay (then point workspace-kinds at it)
          $patch: delete
          apiVersion: v1
          kind: Secret
          metadata:
            name: workspace-secret
        target:
          kind: Secret
          name: workspace-secret
          version: v1
      - patch: |-
          # purpose: drop upstream sample ConfigMap/workspacekind-image-source; it is not part of a Keelson install
          # upstream: none
          # remove-when: upstream ships an installable WorkspaceKinds overlay (then point workspace-kinds at it)
          $patch: delete
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: workspacekind-image-source
        target:
          kind: ConfigMap
          name: workspacekind-image-source
          version: v1
      - patch: |-
          # purpose: drop upstream sample Workspace/jupyterlab-workspace; it is not part of a Keelson install
          # upstream: none
          # remove-when: upstream ships an installable WorkspaceKinds overlay (then point workspace-kinds at it)
          $patch: delete
          apiVersion: kubeflow.org/v1beta1
          kind: Workspace
          metadata:
            name: jupyterlab-workspace
        target:
          group: kubeflow.org
          kind: Workspace
          name: jupyterlab-workspace
          version: v1beta1
    path: applications/workspaces/upstream/controller/samples
    repoURL: https://github.com/kubeflow/manifests
    targetRevision: 26.10.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
