# Source: keelson/templates/appproject.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: keelson
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
  annotations:
    argocd.argoproj.io/sync-wave: "-1000"
spec:
  description: Keelson-managed Kubeflow modules (pinned upstream sources only).
  sourceRepos:
    - https://github.com/kubeflow/manifests
  destinations:
    - server: https://kubernetes.default.svc
      namespace: auth
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: kubeflow
    - server: https://kubernetes.default.svc
      namespace: kubeflow-system
    - server: https://kubernetes.default.svc
      namespace: oauth2-proxy
  # Upstream ships CRDs, ClusterRoles, webhooks and Namespaces.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

