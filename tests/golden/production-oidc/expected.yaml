# Source: keelson/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: dex
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
spec:
  destination:
    namespace: auth
    server: https://kubernetes.default.svc
  project: keelson
  source:
    kustomize:
      patches:
      - patch: |-
          # purpose: set Dex connectors and static users from auth values (upstream-documented config replacement)
          # upstream: none
          # remove-when: upstream Dex config supports adding connectors without replacing config.yaml
          - op: replace
            path: /data/config.yaml
            value: |
              connectors:
              - config:
                  claimMapping:
                    groups: roles
                  clientID: $KEELSON_DEX_IDP_CLIENT_ID
                  clientSecret: $KEELSON_DEX_IDP_CLIENT_SECRET
                  insecureEnableGroups: true
                  issuer: https://login.example.com
                  redirectURI: https://kubeflow.example.com/dex/callback
                  scopes:
                  - openid
                  - email
                  - profile
                id: idp
                name: idp
                type: oidc
              enablePasswordDB: false
              issuer: http://dex.auth.svc.cluster.local:5556/dex
              logger:
                format: text
                level: debug
              oauth2:
                skipApprovalScreen: true
              staticClients:
              - idEnv: OIDC_CLIENT_ID
                name: Dex Login Application
                redirectURIs:
                - /oauth2/callback
                secretEnv: OIDC_CLIENT_SECRET
              storage:
                config:
                  inCluster: true
                type: kubernetes
              web:
                http: 0.0.0.0:5556
        target:
          kind: ConfigMap
          name: dex
          version: v1
      - patch: |-
          # purpose: restart Dex when its config changes; pass connector client IDs and secrets from the user's Secret
          # upstream: none
          # remove-when: never (Keelson intent: auth.dex.connectors[].secretRef)
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: dex
          spec:
            template:
              metadata:
                annotations:
                  keelson.io/dex-config: "db71b1db1f13cf470bea017bce1192970df7dffb0d5af06d0361a0548104b524"
              spec:
                containers:
                  - name: dex
                    env:
                      - name: KEELSON_DEX_IDP_CLIENT_ID
                        valueFrom:
                          secretKeyRef:
                            key: id
                            name: dex-idp
                      - name: KEELSON_DEX_IDP_CLIENT_SECRET
                        valueFrom:
                          secretKeyRef:
                            key: secret
                            name: dex-idp
        target:
          group: apps
          kind: Deployment
          name: dex
          version: v1
      - patch: |-
          # purpose: Dex reads the static client ID and secret from the user's Secret, not upstream's public literals
          # upstream: none
          # remove-when: upstream ships a production overlay without literal secrets
          - op: test
            path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
            value: dex-oidc-client
          - op: remove
            path: /spec/template/spec/containers/0/envFrom/0
          - op: add
            path: /spec/template/spec/containers/0/env/-
            value:
              name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "kubeflow-oidc-client"
                  key: client-id
          - op: add
            path: /spec/template/spec/containers/0/env/-
            value:
              name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "kubeflow-oidc-client"
                  key: client-secret
        target:
          group: apps
          kind: Deployment
          name: dex
          version: v1
    path: common/dex/overlays/oauth2-proxy
    repoURL: https://github.com/kubeflow/manifests
    targetRevision: 26.10.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true

