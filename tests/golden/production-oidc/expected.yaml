# Source: keelson/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: oauth2-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
spec:
  destination:
    namespace: oauth2-proxy
    server: https://kubernetes.default.svc
  project: keelson
  source:
    kustomize:
      patches:
      - patch: |-
          # purpose: secure cookies when users reach Kubeflow over HTTPS
          # upstream: none
          # remove-when: never (Keelson intent: tls.issuer=existing|external)
          - op: replace
            path: /data/FORCE_HTTPS
            value: "true"
        target:
          kind: ConfigMap
          name: oauth2-proxy-parameters
          version: v1
      - patch: |-
          # purpose: oauth2-proxy reads its client ID, client secret and cookie secret from the user's Secrets, not upstream's public literals
          # upstream: none
          # remove-when: upstream ships a production overlay without literal secrets
          - op: test
            path: /spec/template/spec/containers/0/env/0/name
            value: OAUTH2_PROXY_CLIENT_ID
          - op: replace
            path: /spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/name
            value: "kubeflow-oidc-client"
          - op: test
            path: /spec/template/spec/containers/0/env/1/name
            value: OAUTH2_PROXY_CLIENT_SECRET
          - op: replace
            path: /spec/template/spec/containers/0/env/1/valueFrom/secretKeyRef/name
            value: "kubeflow-oidc-client"
          - op: test
            path: /spec/template/spec/containers/0/env/2/name
            value: OAUTH2_PROXY_COOKIE_SECRET
          - op: replace
            path: /spec/template/spec/containers/0/env/2/valueFrom/secretKeyRef/name
            value: "oauth2-proxy-cookie"
        target:
          group: apps
          kind: Deployment
          name: oauth2-proxy
          version: v1
    path: common/oauth2-proxy/overlays/m2m-dex-only
    repoURL: https://github.com/kubeflow/manifests
    targetRevision: 26.10.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true

