apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: istio
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
spec:
  destination:
    namespace: istio-system
    server: https://kubernetes.default.svc
  ignoreDifferences:
