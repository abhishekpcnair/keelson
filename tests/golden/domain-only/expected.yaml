---
# Source: keelson/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-istio-resources
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: kubeflow-istio-resources
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  destination:
    namespace: kubeflow
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: rbac.authorization.k8s.io
    jsonPointers:
    - /rules
    kind: ClusterRole
    name: kubeflow-istio-admin
  project: keelson
  source:
    kustomize:
      patches:
      - patch: |-
          # purpose: serve the Kubeflow Gateway only on `domain`
          # upstream: none
          # remove-when: never (Keelson intent: domain)
          - op: replace
            path: /spec/servers/0/hosts
            value:
              - "kubeflow.internal.example.com"
        target:
          group: networking.istio.io
          kind: Gateway
          name: kubeflow-gateway
          version: v1alpha3
    path: common/istio/kubeflow-istio-resources/base
    repoURL: https://github.com/kubeflow/manifests
    targetRevision: 26.10.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
    - RespectIgnoreDifferences=true

