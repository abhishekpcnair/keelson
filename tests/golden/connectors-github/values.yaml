# connectors-github: dev install with the static user and one GitHub connector, Istio TLS.
domain: kubeflow.example.com
tls:
  issuer: existing
  secretRef:
    name: kubeflow-tls
auth:
  dex:
    connectors:
      - type: github
        id: github
        secretRef:
          name: dex-github
        orgs:
          - name: my-org
            teams: [ml-platform]
