---
# Source: keelson/templates/appproject.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: keelson
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
  annotations:
    # Before every module Application (lowest module wave is -100).
    argocd.argoproj.io/sync-wave: "-1000"
spec:
  description: Keelson-managed Kubeflow modules (pinned upstream sources only).
  sourceRepos:
    - https://github.com/kubeflow/manifests
  destinations:
    - server: https://kubernetes.default.svc
      namespace: auth
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: kubeflow
    - server: https://kubernetes.default.svc
      namespace: kubeflow-system
    - server: https://kubernetes.default.svc
      namespace: oauth2-proxy
  # Upstream ships CRDs, ClusterRoles, webhooks and Namespaces.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

---
# Source: keelson/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: keelson
  source:
    path: common/cert-manager/base
    repoURL: https://github.com/kubeflow/manifests
    targetRevision: 26.10.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true

