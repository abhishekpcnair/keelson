# profiles: the parent release with profiles[] set. It renders the keelson-profiles
# Application (ADR 0004) and the profile namespaces in the AppProject. Kept out of
# kind-core on purpose: it needs the e2e override of keelson.selfSource (MODULES=profiles serves the
# chart under test from the in-cluster registry, #129).
platform: kind
# As in kind-core: CI runs tests/e2e/pss.sh after this scenario too, and it checks this label.
profileNamespaceLabels:
  keelson.io/e2e: "true"
profiles:
  - name: kubeflow-user-example-com
    owner: user@example.com
    contributors: [bob@example.com]
