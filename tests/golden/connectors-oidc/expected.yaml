# Source: keelson/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: dex
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
spec:
  destination:
    namespace: auth
    server: https://kubernetes.default.svc
  project: keelson
  source:
    kustomize:
      patches:
      - patch: |-
          # purpose: set Dex connectors and static users from auth values (upstream-documented config replacement)
          # upstream: none
          # remove-when: upstream Dex config supports adding connectors without replacing config.yaml
          - op: replace
            path: /data/config.yaml
            value: |
              connectors:
              - config:
                  claimMapping:
                    groups: groups
                  clientID: $KEELSON_DEX_CORP_SSO_CLIENT_ID
                  clientSecret: $KEELSON_DEX_CORP_SSO_CLIENT_SECRET
                  insecureEnableGroups: true
                  issuer: https://idp.example.com/realms/corp
                  redirectURI: https://kubeflow.example.com/dex/callback
                  scopes:
                  - openid
                  - profile
                  - email
                  - groups
                id: corp-sso
                name: Corp SSO
                type: oidc
              enablePasswordDB: true
              issuer: http://dex.auth.svc.cluster.local:5556/dex
              logger:
                format: text
                level: debug
              oauth2:
                skipApprovalScreen: true
              staticClients:
              - idEnv: OIDC_CLIENT_ID
                name: Dex Login Application
                redirectURIs:
                - /oauth2/callback
                secretEnv: OIDC_CLIENT_SECRET
              staticPasswords:
              - email: user@example.com
                hashFromEnv: DEX_USER_PASSWORD
                userID: "15841185641784"
                username: user
              storage:
                config:
                  inCluster: true
                type: kubernetes
              web:
                http: 0.0.0.0:5556
        target:
          kind: ConfigMap
          name: dex
          version: v1
      - patch: |-
          # purpose: pass connector client IDs and secrets to Dex from the user's Secret
          # upstream: none
          # remove-when: never (Keelson intent: auth.dex.connectors[].secretRef)
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: dex
          spec:
            template:
              spec:
                containers:
                  - name: dex
                    env:
                      - name: KEELSON_DEX_CORP_SSO_CLIENT_ID
                        valueFrom:
                          secretKeyRef:
                            key: clientID
                            name: dex-corp-sso
                      - name: KEELSON_DEX_CORP_SSO_CLIENT_SECRET
                        valueFrom:
                          secretKeyRef:
                            key: clientSecret
                            name: dex-corp-sso
        target:
          group: apps
          kind: Deployment
          name: dex
          version: v1
    path: common/dex/overlays/oauth2-proxy
    repoURL: https://github.com/kubeflow/manifests
    targetRevision: 26.10.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true

