# Source: keelson/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-istio-resources
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: kubeflow-istio-resources
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  destination:
    namespace: kubeflow
    server: https://kubernetes.default.svc
  project: keelson
  source:
    kustomize:
      patches:
      - patch: |-
          # purpose: serve `domain` over HTTPS with the user's TLS Secret, redirect HTTP
          # upstream: none
          # remove-when: never (Keelson intent: tls.issuer=existing)
          - op: replace
            path: /spec/servers
            value:
              - port: { number: 80, name: http, protocol: HTTP }
                hosts:
                  - "kubeflow.example.com"
                tls:
                  httpsRedirect: true
              - port: { number: 443, name: https, protocol: HTTPS }
                hosts:
                  - "kubeflow.example.com"
                tls:
                  mode: SIMPLE
                  credentialName: "kubeflow-tls"
        target:
          group: networking.istio.io
          kind: Gateway
          name: kubeflow-gateway
          version: v1alpha3
    path: common/istio/kubeflow-istio-resources/base
    repoURL: https://github.com/kubeflow/manifests
    targetRevision: 26.10.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true

