# tls-letsencrypt: the chart in component mode, as the keelson-tls Application renders it
# (ADR 0004) for tls.issuer letsencrypt (#23). An ACME ClusterIssuer for Let's Encrypt
# staging with a DNS-01 Azure DNS solver (managed identity, no Secret), and the Certificate.
component: tls
domain: kubeflow.example.com
tls:
  issuer: letsencrypt
  acme:
    email: platform-team@example.com
    dns01:
      azureDNS:
        subscriptionID: 00000000-0000-0000-0000-000000000000
        resourceGroupName: dns-zones
        hostedZoneName: example.com
        managedIdentity:
          clientID: 11111111-1111-1111-1111-111111111111
