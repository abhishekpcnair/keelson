---
# Source: keelson/templates/components/tls.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keelson-tls
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: keelson-tls
spec:
  secretName: keelson-tls
  dnsNames:
    - "kubeflow.example.com"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: keelson-letsencrypt-staging

---
# Source: keelson/templates/components/tls.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: keelson-letsencrypt-staging
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: keelson-tls
  annotations:
    # Before the Certificate that uses it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  acme:
    email: "platform-team@example.com"
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # cert-manager creates the account key in this Secret (cert-manager namespace). One account per server.
    privateKeySecretRef:
      name: keelson-letsencrypt-staging
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: "00000000-0000-0000-0000-000000000000"
            resourceGroupName: "dns-zones"
            hostedZoneName: "example.com"
            managedIdentity:
              clientID: "11111111-1111-1111-1111-111111111111"
