# Source: keelson/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keelson
    keelson.io/module: dex
  annotations:
    argocd.argoproj.io/sync-wave: "-60"
spec:
  destination:
    namespace: auth
    server: https://kubernetes.default.svc
  project: keelson
  source:
    kustomize:
      patches:
      - patch: |-
          # purpose: set Dex connectors and static users from auth values (upstream-documented config replacement)
          # upstream: none
          # remove-when: upstream Dex config supports adding connectors without replacing config.yaml
          - op: replace
            path: /data/config.yaml
            value: |
              connectors:
              - config:
                  clientID: $KEELSON_DEX_ENTRA_CLIENT_ID
                  clientSecret: $KEELSON_DEX_ENTRA_CLIENT_SECRET
                  emailToLowercase: true
                  groupNameFormat: name
                  groups:
                  - ml-vision
                  onlySecurityGroups: false
                  redirectURI: https://kubeflow.example.com/dex/callback
                  tenant: 00000000-0000-0000-0000-000000000000
                  useGroupsAsWhitelist: true
                id: entra
                name: Entra ID
                type: microsoft
              enablePasswordDB: false
              issuer: http://dex.auth.svc.cluster.local:5556/dex
              logger:
                format: text
                level: debug
              oauth2:
                skipApprovalScreen: true
              staticClients:
              - idEnv: OIDC_CLIENT_ID
                name: Dex Login Application
                redirectURIs:
                - /oauth2/callback
                secretEnv: OIDC_CLIENT_SECRET
              storage:
                config:
                  inCluster: true
                type: kubernetes
              web:
                http: 0.0.0.0:5556
        target:
          kind: ConfigMap
          name: dex
          version: v1
      - patch: |-
          # purpose: restart Dex when its config changes; pass connector client IDs and secrets from the user's Secret
          # upstream: none
          # remove-when: never (Keelson intent: auth.dex.connectors[].secretRef)
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: dex
          spec:
            template:
              metadata:
                annotations:
                  keelson.io/dex-config: "dfdc13296c315cf4e810383c59aa00d8d9e7d2c5fd6198f82b11ca154650c3ff"
              spec:
                containers:
                  - name: dex
                    env:
                      - name: KEELSON_DEX_ENTRA_CLIENT_ID
                        valueFrom:
                          secretKeyRef:
                            key: clientID
                            name: dex-entra
                      - name: KEELSON_DEX_ENTRA_CLIENT_SECRET
                        valueFrom:
                          secretKeyRef:
                            key: clientSecret
                            name: dex-entra
        target:
          group: apps
          kind: Deployment
          name: dex
          version: v1
    path: common/dex/overlays/oauth2-proxy
    repoURL: https://github.com/kubeflow/manifests
    targetRevision: 26.10.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true

