# aks-entra-external: production on AKS, Entra ID login, TLS ends at the cloud load balancer.
environment: production
domain: kubeflow.example.com
tls:
  issuer: external
auth:
  staticUsers:
    enabled: false
  oidcClient:
    secretRef:
      name: kubeflow-oidc-client
  cookie:
    secretRef:
      name: oauth2-proxy-cookie
  dex:
    connectors:
      - type: microsoft
        id: entra
        name: Entra ID
        tenant: 00000000-0000-0000-0000-000000000000
        allowedGroups: [ml-vision]
        secretRef:
          name: dex-entra
