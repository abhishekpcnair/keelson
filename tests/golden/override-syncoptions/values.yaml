# override-syncoptions: kind-core plus appSpecOverride syncOptions (#65) and ignoreDifferences (#88).
platform: kind
# #65: override syncOptions merge into the engine defaults by key.
advanced:
  modules:
    istio:
      appSpecOverride:
        syncPolicy:
          syncOptions: [CreateNamespace=false, PruneLast=true]
    # An override can't turn off RespectIgnoreDifferences on a module with ignoreDifferences.
    kubeflow-roles:
      appSpecOverride:
        syncPolicy:
          syncOptions: [RespectIgnoreDifferences=false]
    # A module with no registry ignoreDifferences: an override entry also forces RespectIgnoreDifferences=true (#88).
    cert-manager-kubeflow:
      appSpecOverride:
        ignoreDifferences:
          - group: cert-manager.io
            kind: ClusterIssuer
            name: kubeflow-self-signing-issuer
            jsonPointers: [/spec/selfSigned]
