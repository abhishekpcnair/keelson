# Test-only in-cluster OCI registry for the root-Application e2e mode (#22, ADR 0004 point 8).
# Not part of the chart. The image is upstream registry:2.8.3, pinned by digest (no fork).
# Storage is an emptyDir, so the chart versions pushed here last only for one run.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: e2e-registry
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: e2e-registry
spec:
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: 5000
