apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.argocd.project }}
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/part-of: keelson
  annotations:
    {{- /* Before every module Application (lowest module wave is -100). */}}
    argocd.argoproj.io/sync-wave: "-1000"
spec:
  description: Keelson-managed Kubeflow modules (pinned upstream sources only).
  sourceRepos:
    {{- include "keelson.sourceRepos" . | nindent 4 }}
  {{- $ns := include "keelson.destinationNamespaces" . | fromYamlArray }}
  {{- if $ns }}
  destinations:
    {{- range $ns }}
    - server: {{ $.Values.argocd.destinationServer }}
      namespace: {{ . }}
    {{- end }}
  {{- else }}
  destinations: []
  {{- end }}
  # Upstream ships CRDs, ClusterRoles, webhooks and Namespaces.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
