name: istio
wave: -70
source:
  type: kustomize
  path: common/istio/istio-install/overlays/oauth2-proxy
namespace: istio-system
namespaces: [istio-system, kube-system, kubeflow]
dependsOn: [istio-crds, istio-namespace, kubeflow-namespace]
defaultEnabled: true
translations: []
smokeTest: none  # e2e harness lands in #4
upstreamHelmChart: common/istio/helm
# istiod patches its validating webhook at runtime: it injects caBundle and flips
# failurePolicy from Ignore to Fail once ready (Istio's ArgoCD guidance).
ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    name: istio-validator-istio-system
    jqPathExpressions:
      - .webhooks[]?.clientConfig.caBundle
      - .webhooks[]?.failurePolicy
