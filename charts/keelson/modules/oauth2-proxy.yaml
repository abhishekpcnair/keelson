name: oauth2-proxy
wave: -60
source:
  type: kustomize
  path: common/oauth2-proxy/overlays/m2m-dex-only
  platformPaths: { kind: common/oauth2-proxy/overlays/m2m-dex-and-kind }
namespace: oauth2-proxy
namespaces: [oauth2-proxy, istio-system]
dependsOn: [istio]
defaultEnabled: true
translations: [domain]
smokeTest: none  # e2e harness lands in #4
upstreamHelmChart: common/oauth2-proxy/helm
