name: kubeflow-roles
wave: -50
source:
  type: kustomize
  path: common/kubeflow-roles/base
namespace: kubeflow
namespaces: [kubeflow]
dependsOn: []
defaultEnabled: true
translations: []
smokeTest: none  # e2e harness lands in #4
upstreamHelmChart: common/kubeflow-roles/helm
# Aggregated ClusterRoles: the RBAC controller fills in .rules at runtime.
# Listed by name, so drift on the non-aggregated roles still shows.
ignoreDifferences:
  - {group: rbac.authorization.k8s.io, kind: ClusterRole, name: kubeflow-admin, jsonPointers: [/rules]}
  - {group: rbac.authorization.k8s.io, kind: ClusterRole, name: kubeflow-edit, jsonPointers: [/rules]}
  - {group: rbac.authorization.k8s.io, kind: ClusterRole, name: kubeflow-view, jsonPointers: [/rules]}
