dependsOn: [dashboard]
defaultEnabled: true
translations: []
smokeTest: none  # tests/e2e/profiles.py lands with contributors (#9, part 2) and the e2e harness (#4)
upstreamHelmChart: none  # Keelson-owned; no upstream chart
