# Keelson values. See docs/design/0001-architecture.md §5.3 for the full planned API.
upstream:
  manifestsRepo: https://github.com/kubeflow/manifests
  manifestsRef: "26.10.0"
# Cluster type: generic | kind. Selects platform-specific upstream overlays.
platform: generic
# Hostname users open Kubeflow on, without a scheme. Empty keeps the upstream
# default (Gateway hosts "*", HTTP). See docs/configuration/domain-and-tls.md.
domain: ""
tls:
  # none: HTTP, as upstream. existing: Istio terminates TLS with your Secret.
  # external: TLS ends in front of the cluster (cloud LB, App Gateway).
  issuer: none
  # issuer=existing: a kubernetes.io/tls Secret in istio-system. Name only.
  secretRef:
    name: ""
# dev | production. production rejects static users and needs a Dex connector.
environment: dev
auth:
  # The upstream static user (user@example.com). For Kind and dev only.
  staticUsers:
    enabled: true
  dex:
    # Identity providers. See docs/configuration/authentication.md.
    # - type: oidc
    #   id: corp
    #   issuer: https://idp.example.com
    #   secretRef: { name: dex-corp }   # keys clientID, clientSecret, in namespace auth
    connectors: []
  # Production secrets. Empty names keep upstream's public literals (Kind and dev only).
  # With environment=production both names are required. Make the Secrets yourself:
  # docs/configuration/authentication.md.
  oidcClient:
    # Secret in BOTH namespaces auth and oauth2-proxy. Keys: client-id, client-secret.
    secretRef:
      name: ""
  cookie:
    # Secret in namespace oauth2-proxy. Key: cookie-secret.
    secretRef:
      name: ""
workspaces:
  # WorkspaceKinds to install from upstream's samples: jupyterlab, codeserver, rstudio.
  # [] installs none (bring your own). See docs/modules/workspaces.md.
  kinds: [jupyterlab]
argocd:
  namespace: argocd
  project: keelson
  destinationServer: https://kubernetes.default.svc
  # Extra repos the AppProject may pull from (for example, your own patch repo).
  extraSourceRepos: []
# Turn modules on or off by name: `modules.<name>.enabled`. Defaults come from
# charts/keelson/modules/<name>.yaml (defaultEnabled). See docs/modules/README.md.
modules: {}
advanced:
  # Unsupported escape hatch: `modules.<name>.appSpecOverride` is deep-merged over
  # the generated Application spec.
  modules: {}
