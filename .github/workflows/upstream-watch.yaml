name: upstream-watch
on:
  schedule:
    - cron: "23 6 * * 1"   # weekly, Monday
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - id: w
        run: python3 hack/upstream_watch.py --github-output
      - name: Open upstream-bump issue
        if: steps.w.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.w.outputs.latest }}
          CURRENT: ${{ steps.w.outputs.current }}
        run: |
          title="Upstream bump: kubeflow/manifests ${LATEST}"
          if gh issue list --state open --label type/upstream-bump --search "$title in:title" --json number --jq 'length' | grep -q '^0$'; then
            git clone -q --depth 1 --branch "$LATEST" https://github.com/kubeflow/manifests.git /tmp/up
            {
              echo "New upstream release **${LATEST}** (currently pinned: ${CURRENT})."
              echo
              echo "### Component versions (upstream README)"
              sed -n '/^| Component/,/^$/p' /tmp/up/README.md
              echo
              echo "### example/kustomization.yaml resources"
              echo '```'
              sed -n '/^resources:/,$p' /tmp/up/example/kustomization.yaml | grep -v '^\s*#'
              echo '```'
              echo
              echo "Next: run \`/upstream-bump ${LATEST}\` in a new Claude Code session."
            } > body.md
            gh issue create --title "$title" --label type/upstream-bump --label needs-e2e --body-file body.md
          else
            echo "Issue already open."
          fi
      - id: p
        run: python3 hack/upstream_watch.py --tool-pins hack/kind-up.sh --github-output
      - name: Open kind-up pins issue
        if: steps.p.outputs.pins_newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="chore: kind-up pins have newer releases"
          if gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -q '^0$'; then
            {
              echo "These \`hack/kind-up.sh\` pins have a newer stable release:"
              echo
              cat pins.md
              echo
              echo "When you bump a pin, also update its sha256 (\`ARGOCD_INSTALL_SHA256\`, \`METRICS_SERVER_SHA256\`, see #31 and #37)."
              echo "Goes through the factory: \`/triage\` → \`/plan\` → \`plan-approved\` → \`/implement\` → \`/review\`."
            } > pins-body.md
            gh issue create --title "$title" --label type/feature --label module/e2e --body-file pins-body.md
          else
            echo "Issue already open."
          fi
