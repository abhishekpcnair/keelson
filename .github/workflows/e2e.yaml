name: e2e
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, opened]
  schedule:
    - cron: "17 2 * * *"   # nightly
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kind:
    # On a labeled event, run only when the label just added is needs-e2e.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'needs-e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'needs-e2e'))
    # Job-level, so a skipped run can't cancel a real one. Only PR runs share a group;
    # main, schedule and dispatch runs get a unique group and are never cancelled.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('e2e-pr-{0}', github.event.pull_request.number) || format('e2e-run-{0}', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest   # full Kubeflow needs ~16 GB RAM; use a larger runner if core alone is not enough
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with: { version: v4.3.2 }
      - uses: helm/kind-action@v1
        # kind binary only; the cluster comes from make kind-up. Keep these in step with
        # KIND_VERSION and the node image in upstream's tests/install_KinD_create_KinD_cluster_install_kustomize.sh.
        with: { install_only: true, version: v0.33.0, kubectl_version: v1.37.0 }
      # Same limits as upstream tests/install_KinD_create_KinD_cluster_install_kustomize.sh.
      # istio-cni needs them; the runner default (128 instances) crash-loops it.
      - run: sudo sysctl -w fs.inotify.max_user_instances=2280 fs.inotify.max_user_watches=1255360
      - run: make kind-up
      - name: Check the kind-up health apply (#70)
        run: tests/e2e/check_kind_up_health.sh
      # run.sh creates .cache/e2e/venv from tests/e2e/requirements.txt
      # PRs keep the helm install. main, the nightly run and workflow_dispatch use the root Application
      # (#22), which also asserts that the sync waves order the install.
      - run: make e2e MODULES=core
        env:
          E2E_INSTALL: ${{ github.event_name == 'pull_request' && 'helm' || 'root-app' }}
      # Profile namespaces get the Pod Security label and profileNamespaceLabels (#11). Needs no Helm
      # upgrade, so it runs in both install modes.
      - run: tests/e2e/pss.sh
      # Dex opens an OIDC connector that Keelson configured (#43). It upgrades the Helm release, so it
      # runs only in the helm install mode (pull requests). main and nightly use the root Application.
      - if: github.event_name == 'pull_request'
        run: tests/e2e/auth_oidc.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: .cache/e2e/diagnostics/
          if-no-files-found: ignore
