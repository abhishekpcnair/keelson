name: release
on:
  push:
    tags: ["v*.*.*"]
  # Dry runs. A manual run, or a pull request that touches the release files, runs every
  # step except the publishing ones against a throwaway local registry and a throwaway
  # signing key. Nothing is pushed to ghcr.io, written to the public Rekor log, or released.
  workflow_dispatch:
    inputs:
      sbom:
        description: "Also dry-run the sbom job (scans every image, so it takes long). Nothing is attested or uploaded."
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yaml
      - hack/list_images.py
      - hack/release_notes.py
      - charts/keelson/Chart.yaml
permissions:
  contents: write
  packages: write
  id-token: write   # keyless cosign signing
jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.push.outputs.ref }}   # the pushed chart digest, for the sbom job
    env:
      # Only a tag push publishes.
      DRY_RUN: ${{ github.event_name != 'push' }}
    services:
      registry:   # the dry-run push target
        image: registry:2.8.3
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with: { version: v4.3.2 }
      - uses: sigstore/cosign-installer@v4.1.3
        with: { cosign-release: v3.1.4 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Install kustomize (pinned to upstream tests/kustomize_install.sh)
        run: |
          A=kustomize_v5.8.1_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/$A"
          echo "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d  $A" | sha256sum -c
          tar xzf "$A" && sudo mv kustomize /usr/local/bin/
      - run: make upstream-cache
      - name: Check tag matches Chart.yaml
        if: env.DRY_RUN == 'false'
        run: |
          v=$(grep '^version:' charts/keelson/Chart.yaml | awk '{print $2}')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != chart v$v"; exit 1; }
      - name: Release notes from CHANGELOG.md
        if: env.DRY_RUN == 'false'
        run: |
          mkdir -p dist
          python3 hack/release_notes.py "${GITHUB_REF_NAME}" CHANGELOG.md | tee dist/notes.md
      - name: List the referenced upstream images
        run: python3 hack/list_images.py --out dist
      - uses: actions/upload-artifact@v7
        with: { name: images-json, path: dist/images.json }
      - name: Check the self-source default matches the push target
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'EOF'
          import os, yaml
          want = f"ghcr.io/{os.environ['OWNER'].lower()}/charts"
          values = yaml.safe_load(open("charts/keelson/values.yaml")) or {}
          got = ((values.get("keelson") or {}).get("selfSource") or {}).get("repoURL")
          if got is None:
              print("no keelson.selfSource default in values.yaml yet (ADR 0004, #9): nothing to check")
          elif got != want:
              raise SystemExit(f"keelson.selfSource.repoURL is {got}, but this release pushes to {want}")
          else:
              print(f"keelson.selfSource.repoURL matches the push target: {got}")
          EOF
      - name: Package and push
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
          # The token and actor come from env, not from expressions in the script text (#141).
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          helm package charts/keelson -d dist
          if [ "$DRY_RUN" = true ]; then
            registry=localhost:5000; flags=(--plain-http)
          else
            echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
            registry="ghcr.io/${OWNER,,}"; flags=()
          fi
          out=$(helm push dist/keelson-*.tgz "oci://${registry}/charts" "${flags[@]}" 2>&1); echo "$out"
          digest=$(echo "$out" | awk '/^Digest:/{print $2}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "could not parse the pushed digest from helm's output"; exit 1; }
          echo "ref=${registry}/charts/keelson@${digest}" >> "$GITHUB_OUTPUT"
      - name: Dry run only, pull the chart back
        if: env.DRY_RUN == 'true'
        run: |
          version=$(grep '^version:' charts/keelson/Chart.yaml | awk '{print $2}')
          mkdir -p pulled
          helm pull oci://localhost:5000/charts/keelson --version "$version" --plain-http -d pulled
          ls pulled
      - name: Sign and attest the image list (keyless)
        if: env.DRY_RUN == 'false'
        run: |
          cosign sign --yes "${{ steps.push.outputs.ref }}"
          cosign attest --yes --type custom --predicate dist/images.json "${{ steps.push.outputs.ref }}"
      - name: Dry run only, sign and attest with a throwaway key
        if: env.DRY_RUN == 'true'
        env:
          COSIGN_PASSWORD: ""
        run: |
          ref="${{ steps.push.outputs.ref }}"
          cosign generate-key-pair
          # cosign v3 signs with the public-good signing config by default, which includes the
          # Rekor log. Turn that off, so a dry run writes nothing public.
          flags=(--key cosign.key --allow-insecure-registry --use-signing-config=false --tlog-upload=false)
          cosign sign --yes "${flags[@]}" "$ref"
          cosign attest --yes "${flags[@]}" --type custom --predicate dist/images.json "$ref"
          verify=(--key cosign.pub --allow-insecure-registry --insecure-ignore-tlog)
          cosign verify "${verify[@]}" "$ref"
          cosign verify-attestation "${verify[@]}" --type custom "$ref"
      - name: GitHub release
        if: env.DRY_RUN == 'false'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          flags=()
          # A version with a '-' suffix (for example 0.1.0-alpha.1) is a prerelease.
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/keelson-*.tgz dist/images.txt dist/images.json \
            --notes-file dist/notes.md "${flags[@]}"

  # Full SBOM for each upstream image, from 0.1.0 final (#61). Prereleases only get the image list.
  sbom:
    needs: publish
    if: >-
      (github.event_name == 'push' && !contains(github.ref_name, '-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.sbom)
    runs-on: ubuntu-latest
    timeout-minutes: 60   # many images, some of them large; the step summary records the time
    defaults:
      run:
        shell: bash   # bash -eo pipefail: a failed hack/sbom.sh fails a step that pipes it to tee
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
    services:
      registry:   # the dry-run attestation target
        image: registry:2.8.3
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with: { name: images-json, path: dist }
      - uses: azure/setup-helm@v5
        if: env.DRY_RUN == 'true'
        with: { version: v4.3.2 }
      - uses: sigstore/cosign-installer@v4.1.3
        with: { cosign-release: v3.1.4 }
      - name: Install syft (pinned, with checksum)
        run: |
          A=syft_1.57.0_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v1.57.0/$A"
          echo "9c077a7d43029b3b13e98a8db720661e700c4d58db6352153a06395ae4a2a704  $A" | sha256sum -c
          tar xzf "$A" syft && sudo mv syft /usr/local/bin/
      - name: Make a CycloneDX SBOM for each image
        run: hack/sbom.sh dist/images.json sbom 4 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pack the SBOMs
        run: tar czf sbom.tar.gz sbom
      - name: Attest each SBOM to the chart digest (keyless) and attach the archive
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.publish.outputs.ref }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # One attestation for each unique image (unique.txt), not for each module copy.
          while read -r f; do
            cosign attest --yes --type cyclonedx --predicate "sbom/$f" "$REF"
          done < sbom/unique.txt
          gh release upload "${GITHUB_REF_NAME}" sbom.tar.gz
      - name: Dry run only, attest with a throwaway key to a local registry
        if: env.DRY_RUN == 'true'
        env:
          COSIGN_PASSWORD: ""
        run: |
          # The same attest loop as the real step, against a throwaway chart push and key.
          helm package charts/keelson -d dist
          out=$(helm push dist/keelson-*.tgz oci://localhost:5000/charts --plain-http 2>&1); echo "$out"
          digest=$(echo "$out" | awk '/^Digest:/{print $2}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "could not parse the pushed digest"; exit 1; }
          ref="localhost:5000/charts/keelson@${digest}"
          cosign generate-key-pair
          flags=(--key cosign.key --allow-insecure-registry --use-signing-config=false --tlog-upload=false)
          while read -r f; do
            cosign attest --yes "${flags[@]}" --type cyclonedx --predicate "sbom/$f" "$ref"
          done < sbom/unique.txt
          verify=(--key cosign.pub --allow-insecure-registry --insecure-ignore-tlog)
          cosign verify-attestation "${verify[@]}" --type cyclonedx "$ref" | wc -l
