name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
  id-token: write   # keyless cosign signing
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with: { version: v4.3.2 }
      - uses: sigstore/cosign-installer@v3
      - name: Check tag matches Chart.yaml
        run: |
          v=$(grep '^version:' charts/keelson/Chart.yaml | awk '{print $2}')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != chart v$v"; exit 1; }
      - name: Package and push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/keelson -d dist
          out=$(helm push dist/*.tgz oci://ghcr.io/${OWNER,,}/charts 2>&1); echo "$out"
          digest=$(echo "$out" | awk '/Digest:/{print $2}')
          cosign sign --yes "ghcr.io/${OWNER,,}/charts/keelson@${digest}"
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tgz --generate-notes
