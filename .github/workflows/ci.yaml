name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with: { version: v4.3.2 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Install kustomize (pinned to upstream tests/kustomize_install.sh)
        run: |
          A=kustomize_v5.8.1_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/$A"
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/checksums.txt" | grep "  $A$" | sha256sum -c
          tar xzf "$A" && sudo mv kustomize /usr/local/bin/
      - run: make verify
