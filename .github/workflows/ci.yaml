name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with: { version: v4.3.2 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Install kustomize (pinned to upstream tests/kustomize_install.sh)
        run: |
          A=kustomize_v5.8.1_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/$A"
          echo "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d  $A" | sha256sum -c
          tar xzf "$A" && sudo mv kustomize /usr/local/bin/
      - uses: azure/setup-kubectl@v5
        # make namespaces runs kubectl kustomize; keep in step with kubectl_version in e2e.yaml.
        with: { version: v1.37.0 }
      - name: Install argocd CLI (pinned, checksum-verified)
        env:
          # Must match ARGOCD_VERSION in hack/kind-up.sh. Bump both together.
          ARGOCD_VERSION: v3.6.2
          ARGOCD_SHA256: 80cc51ce8eb39d5601d54fd14225ed15a04ccf4baa3427f5c1e72a4e342aa0b2
        run: |
          curl -fsSLo argocd "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          echo "${ARGOCD_SHA256}  argocd" | sha256sum -c -
          sudo install -m 0755 argocd /usr/local/bin/argocd && rm argocd
      - run: make verify
