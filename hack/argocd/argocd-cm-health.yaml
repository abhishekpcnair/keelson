# purpose: ArgoCD health checks so sync waves wait for child Applications (app-of-apps) and Kubeflow Workspaces report real health.
# upstream: none
# remove-when: ArgoCD restores built-in health for argoproj.io/Application (argoproj/argo-cd#3781) and ships a Workspace check; until then, keep.
#
# Apply to an existing ArgoCD (merges into argocd-cm; see docs/argocd.md):
#   kubectl -n argocd patch configmap argocd-cm --type merge --patch-file hack/argocd/argocd-cm-health.yaml
# The Keelson chart never writes argocd-cm. Tested offline with `make health-check` against ArgoCD v3.6.2.
#
# The argoproj.io_Application script is copied from the Argo CD documentation
# (docs/operator-manual/health.md, "Argocd App", argoproj/argo-cd v3.6.2),
# Copyright The Argo Authors, Apache-2.0. See NOTICE.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
  # status.state enum from applications/workspaces/upstream/controller/base/crd/kubeflow.org_workspaces.yaml (26.10.0):
  # Running, Terminating, Paused, Pending, Error, Unknown.
  resource.customizations.health.kubeflow.org_Workspace: |
    hs = {}
    hs.status = "Progressing"
    hs.message = "Waiting for the Workspace controller to report a state"
    if obj.status ~= nil and obj.status.state ~= nil then
      local state = obj.status.state
      if state == "Running" then
        hs.status = "Healthy"
      elseif state == "Paused" then
        hs.status = "Suspended"
      elseif state == "Error" then
        hs.status = "Degraded"
      else
        hs.status = "Progressing"
      end
      if obj.status.stateMessage ~= nil and obj.status.stateMessage ~= "" then
        hs.message = obj.status.stateMessage
      else
        hs.message = "Workspace is " .. state
      end
    end
    return hs
